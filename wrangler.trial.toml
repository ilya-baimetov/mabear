name = "mabear-masha-trial"
main = "worker/trial.ts"
compatibility_date = "2026-11-06"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist-trial"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[services]]
binding = "STORY_SERVICE"
service = "mabear"
