name = "mabear-storybook"
main = "worker/bridge.ts"
compatibility_date = "2026-11-05"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[services]]
binding = "STORY_SERVICE"
service = "mabear"

[[durable_objects.bindings]]
name = "MASHA_SPEECH"
class_name = "MashaSpeech"

[[migrations]]
tag = "masha-speech-v1"
new_sqlite_classes = ["MashaSpeech"]
